<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>For you</title>
<link rel="stylesheet" href="/src/style.css">
<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
</script>
</head>
<body>
  <div id="scroll-track"></div>

  <canvas id="scene-canvas"></canvas>

  <div id="control-hints">
    <div class="hint" id="hint-scroll">
      <svg class="hint-icon" viewBox="0 0 24 36" aria-hidden="true">
        <rect x="1.5" y="1.5" width="21" height="33" rx="10.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle class="hint-dot" cx="12" cy="10" r="3" fill="currentColor"/>
      </svg>
      <p>Скролль, чтобы двигаться дальше</p>
    </div>
    <div class="hint" id="hint-candles">
      <svg class="hint-icon" viewBox="0 0 32 32" aria-hidden="true">
        <circle class="hint-ring" cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
      </svg>
      <p>Загадай желание, задуй свечи, нажимая на них</p>
    </div>
  </div>

  <div id="loading-screen">
    <div id="loading-content">
      <p id="loading-note"><span id="loading-note-name">Вике</span>, на её 17-летие</p>
      <div id="loading-mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="1.6" fill="currentColor"/>
          <circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
        </svg>
      </div>
      <div id="loading-bar-track">
        <div id="loading-bar-fill"></div>
      </div>
      <p id="loading-tip"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
